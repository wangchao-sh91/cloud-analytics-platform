apiVersion: v1
kind: Service
metadata:
  name: {{ include "cap.name" (dict "root" . "component" "api") }}
spec:
  selector:
    {{- include "cap.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cap.name" (dict "root" . "component" "api") }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "cap.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      annotations:
        cap.lab/revision: {{ .Release.Revision | quote }}
      labels:
        {{- include "cap.selector" (dict "root" . "component" "api") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "cap.name" (dict "root" . "component" "api-wait") }}
      initContainers:
        - name: wait-migration
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: [python, -m, app.wait, migration, --timeout, {{ .Values.migration.waitSeconds | quote }}]
          env:
            - name: MIGRATION_JOB
              value: {{ include "cap.job" . }}
          envFrom:
            - secretRef:
                name: {{ include "cap.name" (dict "root" . "component" "db-secret") }}
      containers:
        - name: api
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "cap.name" (dict "root" . "component" "db-secret") }}
          ports:
            - containerPort: 8000
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cap.name" (dict "root" . "component" "frontend") }}
spec:
  selector:
    {{- include "cap.selector" (dict "root" . "component" "frontend") | nindent 4 }}
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cap.name" (dict "root" . "component" "frontend") }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "cap.selector" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/nginx: {{ include (print $.Template.BasePath "/nginx.yaml") . | sha256sum }}
      labels:
        {{- include "cap.selector" (dict "root" . "component" "frontend") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "cap.name" (dict "root" . "component" "nginx") }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          ports:
            - containerPort: 80
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
