apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cap.name" (dict "root" . "component" "db-config") }}
data:
  POSTGRES_DB: {{ .Values.database.name | quote }}
  POSTGRES_USER: {{ .Values.database.user | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cap.name" (dict "root" . "component" "postgres") }}
spec:
  selector:
    {{- include "cap.selector" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cap.name" (dict "root" . "component" "postgres") }}
spec:
  serviceName: {{ include "cap.name" (dict "root" . "component" "postgres") }}
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "cap.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cap.selector" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      containers:
        - name: {{ include "cap.name" (dict "root" . "component" "postgres") }}
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "cap.name" (dict "root" . "component" "db-config") }}
            - secretRef:
                name: {{ include "cap.name" (dict "root" . "component" "db-secret") }}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.database.persistence.storageClass }}
        storageClassName: {{ .Values.database.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.persistence.size }}
