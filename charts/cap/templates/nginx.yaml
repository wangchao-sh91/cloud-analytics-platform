apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cap.name" (dict "root" . "component" "nginx") }}
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        location /api {
            proxy_pass http://{{ include "cap.name" (dict "root" . "component" "api") }}:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
