{{- $name := include "cap.name" (dict "root" . "component" "db-secret") -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "cap.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    cap.lab/identity: {{ include "cap.identity" . | quote }}
type: Opaque
data:
  {{- if $existing }}
  {{- toYaml $existing.data | nindent 2 }}
  {{- else }}
  {{- $password := randAlphaNum 48 }}
  POSTGRES_PASSWORD: {{ $password | b64enc | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s:5432/%s" .Values.database.user $password (include "cap.name" (dict "root" . "component" "postgres")) .Values.database.name | b64enc | quote }}
  {{- end }}
