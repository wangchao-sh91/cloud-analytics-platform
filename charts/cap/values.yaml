naming:
  mode: release
frontend:
  image:
    repository: cap-frontend
    tag: cap002-v1
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 32Mi}
    limits: {memory: 128Mi}
backend:
  image:
    repository: cap-backend
    tag: cap002-v1
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 96Mi}
    limits: {memory: 384Mi}
database:
  image:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent
  name: cap
  user: cap
  persistence:
    storageClass: ""
    size: 2Gi
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
migration:
  waitSeconds: 180
  deadlineSeconds: 300
  backoffLimit: 0
