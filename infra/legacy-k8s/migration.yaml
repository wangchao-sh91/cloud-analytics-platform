apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-${IMAGE_TAG}
  namespace: cap
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: cap-backend:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          command: [alembic, upgrade, head]
          envFrom:
            - secretRef:
                name: database-secret
